name: Build IceClient mod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Kompilacja i testy
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log

      - name: Zapisz log budowania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Zapisz raporty testow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore

      - name: Zapisz mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: iceclient-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
